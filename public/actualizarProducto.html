<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Actualizar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h3 class="text-center mb-4">Buscar y Actualizar Producto</h3>

        <form id="buscarForm" class="bg-white p-4 rounded shadow-sm mb-4">
            <div class="mb-3">
                <label for="buscarId" class="form-label">ID del producto</label>
                <input type="number" class="form-control" id="buscarId" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="buscarProducto()">Buscar</button>
        </form>

        <div id="productoFormContainer" style="display:none;">
            <form id="productoForm" class="bg-white p-4 rounded shadow-sm">
                <input type="hidden" id="id" name="id">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del producto</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" disabled>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" disabled></textarea>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Nuevo Precio</label>
                    <input type="number" step="0.01" class="form-control" id="precio" name="precio" required>
                </div>

                <button type="button" class="btn btn-success" onclick="actualizarProducto()">Actualizar</button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="../menu.html" class="btn btn-outline-secondary">Volver al menú</a>
        </div>
    </div>

    <script src="../controllers/actualizarProducto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
